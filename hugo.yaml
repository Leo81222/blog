baseURL: "https://leo81222.github.io/blog/"
languageCode: "zh-cn"
defaultContentLanguage: "zh"
hasCJKLanguage: true
title: "网安学习笔记"
theme: "stack"
locale: "zh-cn"

pagination:
  pagerSize: 10

permalinks:
  post: "/p/:slug/"
  page: "/:slug/"

outputs:
  home:
    - HTML
    - RSS
    - JSON

params:
  rssFullContent: true

  sidebar:
    subtitle: "网络安全学习笔记与靶场 Writeup 记录"

  comments:
    enabled: false

  dateFormat:
    published: ":date_long"
    lastUpdated: ":date_long"

  widgets:
    homepage:
      - type: search
      - type: archives
        params:
          limit: 5
      - type: tag-cloud
        params:
          limit: 12
    page: []

  footer:
    since: 2026

menu:
  main:
    - name: 首页
      url: /
      weight: -100
      params:
        icon: home
    - name: 归档
      url: /archives/
      weight: -90
      params:
        icon: archives
    - name: 分类
      url: /categories/
      weight: -80
      params:
        icon: categories
    - name: 标签
      url: /tags/
      weight: -70
      params:
        icon: tag
    - name: 关于
      url: /about/
      weight: -60
      params:
        icon: user
    - name: 搜索
      url: /search/
      weight: -50
      params:
        icon: search
